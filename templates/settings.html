{% extends "base.html" %}{% block title %}Account · STU{% endblock %}{% block content %}
<div class="page-heading"><div><div class="eyebrow">IDENTITY MANAGEMENT</div><h1>Account <em>settings.</em></h1><p class="muted">Manage your investigator profile and credentials.</p></div></div>
<div class="panel settings-panel"><form method="post" class="form-stack"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><label>USERNAME<input name="username" value="{{ user.username }}" minlength="3" maxlength="24" required></label><label>EMAIL ADDRESS<input value="{{ user.email }}" disabled></label><div class="form-divider"></div><div class="eyebrow">CHANGE PASSWORD</div><label>CURRENT PASSWORD<input type="password" name="old_password" autocomplete="current-password" placeholder="Required to change password"></label><label>NEW PASSWORD<input type="password" name="new_password" minlength="10" autocomplete="new-password" placeholder="At least 10 characters"></label><button class="btn primary">Save changes ↗</button></form></div>
{% endblock %}
